    <title>VIDEO KETCEH</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: pink;
            color: black;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-family: Georgia, serif;
        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .video {
            position: relative;
            background-color: white;
            border: 2px solid white;
            overflow: hidden;
            border-radius: 6px;
        }

        .video a {
            display: block;
            position: relative;
            text-decoration: none;
        }

        .video img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        /* Tombol PLAY */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 55px;
            height: 55px;

            background-color: rgba(255, 0, 0, 0.9);
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            padding-left: 4px;

            transition: 0.2s;
        }

        .video a:hover .play-button {
            transform: translate(-50%, -50%) scale(1.15);
        }

        /* Efek hover thumbnail */
        .video img {
            transition: 0.2s;
        }

        .video a:hover img {
            transform: scale(1.03);
        }

        /* Tablet */
        @media (max-width: 800px) {
            .video-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* HP */
        @media (max-width: 500px) {
            .video-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
